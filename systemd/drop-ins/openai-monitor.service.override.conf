# Drop-in override for openai-monitor.service
# Installed at: /etc/systemd/system/openai-monitor.service.d/override.conf
#
# Adds OnFailure alerting and disables the restart rate-limit so the bot is
# never permanently "failed" even after repeated crashes (we prefer infinite
# Restart=always + Telegram alert over systemd giving up silently).

[Unit]
OnFailure=monitor-alert@%N.service
StartLimitIntervalSec=0

[Service]
RestartSec=10
