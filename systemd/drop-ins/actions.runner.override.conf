# Drop-in for /etc/systemd/system/actions.runner.Savin99-openai-monitor.vds-openai-monitor.service.d/override.conf
# Гарантирует, что при падении runner'а он будет перезапущен и мы узнаем.

[Unit]
OnFailure=monitor-alert@%N.service
StartLimitIntervalSec=0

[Service]
Restart=on-failure
RestartSec=30
