name: CI & Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Run unit tests
        run: python3 -m unittest discover -s . -p 'test_*.py' -v

  deploy:
    needs: test
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        run: |
          cd /opt/openai_monitor
          git pull origin master
          systemctl restart openai-monitor
